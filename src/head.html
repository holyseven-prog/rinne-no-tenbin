<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>輪廻の天秤 / 輪迴之天秤</title>
<style>
*{box-sizing:border-box}
:root{--bg:#07070f;--bg2:#15152c;--bg3:#2a2a54;--card:#0d0d1c;--card2:#1a1a38;--edge:#f4f4f4;--edge2:#7a7aa8;--edge3:#9a9ac8;--gbg:#000;--head:#ffe9a0;--sub:#cfcfe6;--dim:#a8a8c8}
body.theme-blue{--bg:#0a1a6e;--bg2:#10299a;--bg3:#2a4ae0;--card:#101f80;--card2:#1a2ca0;--edge2:#5a6ad0;--edge3:#8fa0f0;--gbg:#05083a;--sub:#c8d0ff;--dim:#9aa8e8}
html,body{margin:0;height:100%;background:#000;overflow:hidden}
body{font-family:"MS Gothic","Meiryo","Yu Gothic","Noto Sans Mono CJK JP","Noto Sans CJK JP","Microsoft JhengHei","PingFang TC","Noto Sans CJK TC",monospace}
html[lang="zh-TW"] body{font-family:"Microsoft JhengHei","PingFang TC","Noto Sans CJK TC","MS Gothic","Meiryo",monospace}
#stage{position:absolute;left:0;top:0;width:1280px;height:720px;transform-origin:0 0;background:#000;overflow:hidden;user-select:none;-webkit-user-select:none;color:#fff;font-size:16px;line-height:1.45}
#game,#labels{position:absolute;left:0;top:0;width:1280px;height:720px;display:block}
#game{image-rendering:pixelated;image-rendering:crisp-edges}
#labels{pointer-events:none}
#ui{position:absolute;left:0;top:0;width:1280px;height:720px;pointer-events:none}
#ui *{pointer-events:auto}
.win{position:absolute;background:var(--bg);border:3px solid var(--edge);border-radius:2px;padding:6px 10px;box-shadow:inset 0 0 0 2px var(--bg),inset 0 0 0 3px var(--edge3),3px 3px 0 rgba(0,0,0,.6)}
.win.glass{background:rgba(7,7,15,.93)}
body.theme-blue .win{border-radius:7px}
body.theme-blue .win.glass{background:rgba(10,26,110,.9)}
.win h3{margin:0 0 4px;font-size:15px;font-weight:bold;color:var(--head);border-bottom:1px solid var(--edge2);padding-bottom:2px;letter-spacing:1px}
.btn{display:inline-block;padding:2px 10px;border:2px solid var(--edge);border-radius:2px;background:var(--bg2);color:#fff;cursor:pointer;font:inherit;font-size:14px;line-height:1.5;white-space:nowrap}
body.theme-blue .btn{border-radius:5px}
.btn:hover,.btn.sel{background:var(--bg3);box-shadow:0 0 0 1px var(--head)}
.btn.dis{opacity:.42;cursor:default;box-shadow:none;background:var(--bg2)}
.btn.on{background:#c8960c;border-color:#ffe9a0;color:#000}
.btn.big{font-size:20px;padding:6px 18px}
.gauge{height:13px;border:2px solid var(--edge);background:var(--gbg);border-radius:2px;position:relative;overflow:hidden}
.gauge>i{display:block;height:100%;background:linear-gradient(#fff3a0,#e8a820)}
.gauge.hp>i{background:linear-gradient(#80ff90,#20b040)}
.gauge.need>i{background:linear-gradient(#a0c0ff,#4068d8)}
.sm{font-size:13px;color:var(--sub)}
.dim{color:var(--dim)}
.gold{color:#ffe9a0}
.red{color:#ff9a9a}
.grn{color:#9affb0}
.blu{color:#a8d0ff}
.card{border:2px solid var(--edge2);border-radius:2px;background:var(--card);padding:3px 6px;margin-bottom:4px;cursor:pointer;position:relative}
.card:hover{border-color:#fff;background:var(--card2)}
.card.u1{border-color:#ffd060}.card.u2{border-color:#ff7050}
.card.sel{outline:2px solid #fff}
#modal{position:absolute;left:0;top:0;width:1280px;height:720px;background:rgba(0,0,0,.55);display:none}
.par{background:linear-gradient(#efe0b4,#e0cd96);color:#2a1a08;border:3px solid #6a4a1c;border-radius:2px;box-shadow:inset 0 0 22px rgba(120,80,20,.45)}
.par p{margin:0 0 8px;text-indent:1em}
.tag{display:inline-block;font-size:11px;padding:0 4px;border-radius:2px;margin-right:4px;color:#fff;vertical-align:middle;text-indent:0}
.tag.witness{background:#2a7a3a}.tag.hearsay{background:#a07020}.tag.infer{background:#7a3a8a}
.ink{font-size:12px;padding:0 6px;border-radius:2px;color:#fff}
.ink.wet{background:#1a3a8a}.ink.draft{background:#8a6a1a}.ink.final{background:#4a4a4a}
.scroll{overflow-y:auto;overflow-x:hidden}
.scroll::-webkit-scrollbar{width:8px}.scroll::-webkit-scrollbar-thumb{background:var(--edge3);border-radius:2px}.scroll::-webkit-scrollbar-track{background:var(--gbg)}
table.tb{border-collapse:collapse;width:100%;font-size:14px}
table.tb th{position:sticky;top:0;background:var(--bg);color:var(--head);text-align:left;padding:2px 6px;border-bottom:2px solid var(--edge3);cursor:pointer}
table.tb td{padding:1px 6px;border-bottom:1px solid var(--bg3);white-space:nowrap}
table.tb tr:hover td{background:var(--card2);cursor:pointer}
input[type=range]{width:200px;vertical-align:middle;accent-color:#ffe9a0}
.menu .btn{display:block;margin:6px 0;text-align:center;font-size:18px;padding:4px 10px}
.title-logo{font-size:84px;font-weight:bold;letter-spacing:12px;color:#fff;text-shadow:0 0 18px #6a8aff,3px 3px 0 #000,-2px -2px 0 #000,0 6px 0 #000}
.cur::before{content:"▶ ";color:#ffe9a0}
.kbd{display:inline-block;border:1px solid #fff;border-radius:2px;padding:0 4px;font-size:11px;margin-right:3px;background:#000a}
.fade{animation:fd .5s}@keyframes fd{from{opacity:0}to{opacity:1}}
#tip{position:absolute;display:none;max-width:340px;z-index:50;pointer-events:none;font-size:14px;line-height:1.45;padding:5px 9px}
#tut{position:absolute;left:0;top:0;width:1280px;height:720px;display:none;z-index:40;pointer-events:none}
#tut .hole{position:absolute;border:3px solid #ffe060;border-radius:4px;box-shadow:0 0 0 2000px rgba(0,0,0,.62),0 0 18px #ffe060;pointer-events:none;animation:pulse 1.1s infinite alternate}
@keyframes pulse{from{border-color:#ffe060}to{border-color:#fff}}
#tut .box{position:absolute;width:420px;pointer-events:auto}
#tut .arrow{position:absolute;font-size:34px;color:#ffe060;text-shadow:2px 2px 0 #000;pointer-events:none;animation:bob .6s infinite alternate}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(8px)}}
</style>
</head>
<body class="theme-black">
<div id="stage"><canvas id="game" width="640" height="360"></canvas><canvas id="labels" width="1280" height="720"></canvas><div id="ui"></div><div id="tut"></div><div id="tip" class="win glass"></div><div id="modal"></div></div>
<script>
/*__SCRIPT__*/
</script>
</body>
</html>
