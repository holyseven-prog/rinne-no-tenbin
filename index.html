<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>輪廻の天秤 / 輪迴之天秤</title>
<style>
*{box-sizing:border-box}
:root{--bg:#07070f;--bg2:#15152c;--bg3:#2a2a54;--card:#0d0d1c;--card2:#1a1a38;--edge:#f4f4f4;--edge2:#7a7aa8;--edge3:#9a9ac8;--gbg:#000;--head:#ffe9a0;--sub:#cfcfe6;--dim:#a8a8c8}
body.theme-blue{--bg:#0a1a6e;--bg2:#10299a;--bg3:#2a4ae0;--card:#101f80;--card2:#1a2ca0;--edge2:#5a6ad0;--edge3:#8fa0f0;--gbg:#05083a;--sub:#c8d0ff;--dim:#9aa8e8}
html,body{margin:0;height:100%;background:#000;overflow:hidden}
body{font-family:"MS Gothic","Meiryo","Yu Gothic","Noto Sans Mono CJK JP","Noto Sans CJK JP","Microsoft JhengHei","PingFang TC","Noto Sans CJK TC",monospace}
html[lang="zh-TW"] body{font-family:"Microsoft JhengHei","PingFang TC","Noto Sans CJK TC","MS Gothic","Meiryo",monospace}
#stage{position:absolute;left:0;top:0;width:1280px;height:720px;transform-origin:0 0;background:#000;overflow:hidden;user-select:none;-webkit-user-select:none;color:#fff;font-size:16px;line-height:1.45}
#game,#labels{position:absolute;left:0;top:0;width:1280px;height:720px;display:block}
#game{image-rendering:pixelated;image-rendering:crisp-edges}
#labels{pointer-events:none}
#ui{position:absolute;left:0;top:0;width:1280px;height:720px;pointer-events:none}
#ui *{pointer-events:auto}
.win{position:absolute;background:var(--bg);border:3px solid var(--edge);border-radius:2px;padding:6px 10px;box-shadow:inset 0 0 0 2px var(--bg),inset 0 0 0 3px var(--edge3),3px 3px 0 rgba(0,0,0,.6)}
.win.glass{background:rgba(7,7,15,.93)}
body.theme-blue .win{border-radius:7px}
body.theme-blue .win.glass{background:rgba(10,26,110,.9)}
.win h3{margin:0 0 4px;font-size:15px;font-weight:bold;color:var(--head);border-bottom:1px solid var(--edge2);padding-bottom:2px;letter-spacing:1px}
.btn{display:inline-block;padding:2px 10px;border:2px solid var(--edge);border-radius:2px;background:var(--bg2);color:#fff;cursor:pointer;font:inherit;font-size:14px;line-height:1.5;white-space:nowrap}
body.theme-blue .btn{border-radius:5px}
.btn:hover,.btn.sel{background:var(--bg3);box-shadow:0 0 0 1px var(--head)}
.btn.dis{opacity:.42;cursor:default;box-shadow:none;background:var(--bg2)}
.btn.on{background:#c8960c;border-color:#ffe9a0;color:#000}
.btn.big{font-size:20px;padding:6px 18px}
.gauge{height:13px;border:2px solid var(--edge);background:var(--gbg);border-radius:2px;position:relative;overflow:hidden}
.gauge>i{display:block;height:100%;background:linear-gradient(#fff3a0,#e8a820)}
.gauge.hp>i{background:linear-gradient(#80ff90,#20b040)}
.gauge.need>i{background:linear-gradient(#a0c0ff,#4068d8)}
.sm{font-size:13px;color:var(--sub)}
.dim{color:var(--dim)}
.gold{color:#ffe9a0}
.red{color:#ff9a9a}
.grn{color:#9affb0}
.blu{color:#a8d0ff}
.card{border:2px solid var(--edge2);border-radius:2px;background:var(--card);padding:3px 6px;margin-bottom:4px;cursor:pointer;position:relative}
.card:hover{border-color:#fff;background:var(--card2)}
.card.u1{border-color:#ffd060}.card.u2{border-color:#ff7050}
.card.sel{outline:2px solid #fff}
#modal{position:absolute;left:0;top:0;width:1280px;height:720px;background:rgba(0,0,0,.55);display:none}
.par{background:linear-gradient(#efe0b4,#e0cd96);color:#2a1a08;border:3px solid #6a4a1c;border-radius:2px;box-shadow:inset 0 0 22px rgba(120,80,20,.45)}
.par p{margin:0 0 8px;text-indent:1em}
.tag{display:inline-block;font-size:11px;padding:0 4px;border-radius:2px;margin-right:4px;color:#fff;vertical-align:middle;text-indent:0}
.tag.witness{background:#2a7a3a}.tag.hearsay{background:#a07020}.tag.infer{background:#7a3a8a}
.ink{font-size:12px;padding:0 6px;border-radius:2px;color:#fff}
.ink.wet{background:#1a3a8a}.ink.draft{background:#8a6a1a}.ink.final{background:#4a4a4a}
.scroll{overflow-y:auto;overflow-x:hidden}
.scroll::-webkit-scrollbar{width:8px}.scroll::-webkit-scrollbar-thumb{background:var(--edge3);border-radius:2px}.scroll::-webkit-scrollbar-track{background:var(--gbg)}
table.tb{border-collapse:collapse;width:100%;font-size:14px}
table.tb th{position:sticky;top:0;background:var(--bg);color:var(--head);text-align:left;padding:2px 6px;border-bottom:2px solid var(--edge3);cursor:pointer}
table.tb td{padding:1px 6px;border-bottom:1px solid var(--bg3);white-space:nowrap}
table.tb tr:hover td{background:var(--card2);cursor:pointer}
input[type=range]{width:200px;vertical-align:middle;accent-color:#ffe9a0}
.menu .btn{display:block;margin:6px 0;text-align:center;font-size:18px;padding:4px 10px}
.title-logo{font-size:84px;font-weight:bold;letter-spacing:12px;color:#fff;text-shadow:0 0 18px #6a8aff,3px 3px 0 #000,-2px -2px 0 #000,0 6px 0 #000}
.cur::before{content:"▶ ";color:#ffe9a0}
.kbd{display:inline-block;border:1px solid #fff;border-radius:2px;padding:0 4px;font-size:11px;margin-right:3px;background:#000a}
.fade{animation:fd .5s}@keyframes fd{from{opacity:0}to{opacity:1}}
#tip{position:absolute;display:none;max-width:340px;z-index:50;pointer-events:none;font-size:14px;line-height:1.45;padding:5px 9px}
body .locked{opacity:.22;filter:grayscale(1)}
#game{cursor:grab}
#tut{position:absolute;left:0;top:0;width:1280px;height:720px;display:none;z-index:40;pointer-events:none}
#tut .hole{position:absolute;border:3px solid #ffe060;border-radius:4px;box-shadow:0 0 0 2000px rgba(0,0,0,.62),0 0 18px #ffe060;pointer-events:none;animation:pulse 1.1s infinite alternate}
@keyframes pulse{from{border-color:#ffe060}to{border-color:#fff}}
#tut .box{position:absolute;width:420px;pointer-events:auto}
#tut .arrow{position:absolute;font-size:34px;color:#ffe060;text-shadow:2px 2px 0 #000;pointer-events:none;animation:bob .6s infinite alternate}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(8px)}}
</style>
</head>
<body class="theme-black">
<div id="stage"><canvas id="game" width="640" height="360"></canvas><canvas id="labels" width="1280" height="720"></canvas><div id="ui"></div><div id="tut"></div><div id="tip" class="win glass"></div><div id="modal"></div></div>
<script>
/* ---- 01_util.js ---- */
'use strict';
/* ================= util / constants ================= */
const TICK_DAY = 144, DAYS_YEAR = 12, TICK_YEAR = 1728, MW = 64, MH = 40, TS = 16, START_TICK = 36;
const BOSS_BASE_TICK = 6 * TICK_YEAR;
let G = null, LANG = 'ja';
const TUNE = Object.assign({ bossHp: 2000, bossAtk: 38, bossDef: 22, bossGrow: 1.08, waveBase: 4, waveGrow: 2.2, waveInt: 8, waveDec: 1.1, drift: 1.2, cadMul: 1, pen: 1, disMul: 0, townDrain: 0.55, expDelay: 6, expRatio: 1.1, polRes: 60, warQuests: 0, scorch: 0.28 }, (typeof globalThis !== 'undefined' && globalThis.__TUNE) || {});
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;

const isNum = v => typeof v === 'number' && isFinite(v);

function RNG(seed) { this.s = (seed >>> 0) || 1; }
RNG.prototype.next = function () {
  this.s = (this.s + 0x6D2B79F5) >>> 0;
  let t = this.s;
  t = Math.imul(t ^ (t >>> 15), t | 1);
  t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
};
RNG.prototype.int = function (a, b) { return a + Math.floor(this.next() * (b - a + 1)); };
RNG.prototype.pick = function (arr) { return arr[Math.floor(this.next() * arr.length)]; };
RNG.prototype.chance = function (p) { return this.next() < p; };
RNG.prototype.range = function (a, b) { return a + this.next() * (b - a); };

const rnd = () => G.rng.next();
const rint = (a, b) => G.rng.int(a, b);
const rpick = arr => G.rng.pick(arr);
const rchance = p => G.rng.next() < p;
const rrange = (a, b) => G.rng.range(a, b);
function strHash(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }

/* ---- i18n core ---- */
const S = {};
function fmt(str, v) {
  if (!v) return str;
  return str.replace(/\{(\w+)\}/g, (m, k) => (v[k] === undefined ? m : v[k]));

const li = () => (LANG === 'ja' ? 0 : 1);
function t(k, v) {
  const e = S[k];
  if (!e) return '??' + k;
  return fmt(e[li()], v);
}
function pr(p, v) { return fmt(p[li()], v); }
function nm(e) { return e ? (e.name ? e.name[li()] : e.n ? e.n[li()] : '?') : '?'; }

/* ---- time ---- */
const hourOf = tk => Math.floor((tk % TICK_DAY) / 6);
const dayIdx = tk => Math.floor(tk / TICK_DAY);
const yearOf = tk => Math.floor(tk / TICK_YEAR) + 1;
const seasonOf = tk => Math.floor((dayIdx(tk) % DAYS_YEAR) / 3);
const KANJI_NUM = ['', '一', '二', '三'];
S.season = [['春', '夏', '秋', '冬'], ['春', '夏', '秋', '冬']];
function dateStr(tk, gen) {
  const y = yearOf(tk), s = S.season[0][seasonOf(tk)], d = (dayIdx(tk) % DAYS_YEAR) % 3 + 1, hh = hourOf(tk);
  if (LANG === 'ja') return `第${gen || 1}世 ${y}年目 ${s} ${KANJI_NUM[d]}日目 ${hh}時`;
  return `第${gen || 1}世 第${y}年 ${s} 第${KANJI_NUM[d]}日 ${hh}時`;
}
function timeWord(tk) {
  const h = hourOf(tk);
  return h < 5 ? 'night' : h < 10 ? 'morning' : h < 16 ? 'day' : h < 19 ? 'dusk' : h < 23 ? 'evening' : 'night';
}

const NAMES_M = [

  ['オリン', '奧林'], ['バルト', '巴爾特'], ['ユーリ', '尤里'], ['ディオ', '迪歐'], ['ルカ', '盧卡'], ['ネロ', '內羅'],
  ['ベン', '班恩'], ['ラルフ', '拉爾夫'], ['ゼノ', '澤諾'], ['コルト', '柯爾特'], ['ミハイ', '米海'], ['アベル', '亞伯爾'],

  ['アンナ', '安娜'], ['ノエル', '諾艾爾'], ['ティナ', '蒂娜'], ['ソフィ', '蘇菲'], ['ミレイ', '米蕾'], ['ララ', '菈菈'],

const ADV_JOBS = ['swordsman', 'mage', 'priest', 'thief'];

const TRAITS = {

  curious: ['好奇心', '好奇'], stubborn: ['頑固', '固執'], kind: ['優しい', '溫柔'], ambitious: ['野心家', '野心家'],

const TRAIT_KEYS = Object.keys(TRAITS);

/* monsters: hp atk def spd tier exp gold range */
const MONS = {
  mush: { n: ['ぷくぷく茸', '噗噗菇'], hp: 20, atk: 5, def: 1, spd: 0.8, tier: 1, exp: 6, gold: 2, range: 1.5 },

  goblin: { n: ['小鬼の斥候', '小鬼斥候'], hp: 36, atk: 10, def: 3, spd: 1.0, tier: 2, exp: 12, gold: 5, range: 1.5 },

const MON_BY_TIER = { 1: ['mush', 'bat'], 2: ['turtle', 'goblin'], 3: ['skel', 'wolf'] };
const CADRES = [
  { key: 'verna', n: ['霧の公爵ヴェルナ', '霧公爵 維爾娜'], hp: 380, atk: 19, def: 8, spd: 1.0, range: 4, home: { x: 50, y: 29 } },
  { key: 'garum', n: ['骨の将軍ガルム', '骨將軍 加爾姆'], hp: 460, atk: 22, def: 11, spd: 0.9, range: 1.5, home: { x: 52, y: 11 } },
  { key: 'serene', n: ['影の女王セレネ', '影之女王 瑟蕾娜'], hp: 340, atk: 21, def: 7, spd: 1.3, range: 1.5, home: { x: 46, y: 35 } },

const BOSS = { key: 'noctal', n: ['黒冠の王ノクタール', '黑冠之王 諾克塔爾'], hp: TUNE.bossHp, atk: TUNE.bossAtk, def: TUNE.bossDef, spd: 1.0, range: 1.8, home: { x: 60, y: 17 } };

const POWERS = [
  { id: 'oracle', cost: 6, n: ['神託', '神諭'], d: ['住人に夢でお告げ。行動の傾向を一時的に変える', '以夢境向居民降下神諭，暫時改變其行動傾向'] },
  { id: 'grace', cost: 15, n: ['恩寵', '恩寵'], d: ['回復・幸運・才能の一時付与', '賜予回復、幸運與暫時的才能'] },
  { id: 'trial', cost: 25, n: ['試煉', '試煉'], d: ['困難を与える。成長や悲劇のきっかけ', '降下困難，成為成長或悲劇的契機'] },

];
const POWER_BY_ID = {}; POWERS.forEach(p => POWER_BY_ID[p.id] = p);

const GODS = [
  { id: 'mercy', n: ['慈愛の神', '慈愛之神'], d: ['初期信仰が高く、恩寵が安い。', '初始信仰較高，恩寵較便宜。'], faith0: 70, cost: { grace: 0.75 }, bonus: { grace: 0.08, soul: 0.04 } },
  { id: 'order', n: ['秩序の神', '秩序之神'], d: ['神託が安く、成功しやすい。', '神諭便宜且容易成功。'], faith0: 60, cost: { oracle: 0.6 }, bonus: { oracle: 0.1, force: 0.05 } },
  { id: 'chaos', n: ['混沌の神', '混沌之神'], d: ['試煉と勢力操作が安いが、結果が荒れる。', '試煉與勢力操作便宜，但結果起伏劇烈。'], faith0: 55, cost: { trial: 0.6, force: 0.8 }, bonus: { trial: 0.1 }, wild: 0.08 },
];

const PRAYER_KINDS = ['sick', 'hunger', 'love', 'battle', 'revenge', 'forgive', 'birth', 'fear'];
const PRAYER_ANS = { // which powers can answer
  sick: ['grace', 'oracle'], hunger: ['grace', 'oracle'], love: ['oracle', 'grace'], battle: ['grace', 'oracle'],
  revenge: ['oracle', 'soul'], forgive: ['oracle', 'soul'], birth: ['grace'], fear: ['grace', 'oracle', 'soul'],
};
S.pray_sick = [['体が熱い。どうか、この病を取り除いてください……', '身體發燙。求您，帶走這場病……'], ['傷が癒えません。神よ、あと少しだけ力を。', '傷口遲遲不癒合。神啊，再給我一點力氣。']];

S.pray_battle = [['これから戦いに向かいます。仲間を、どうかお守りください。', '我即將奔赴戰場。求您守護我的夥伴。'], ['剣を握る手が震えます。勇気を、お与えください。', '握劍的手在顫抖。求您賜予我勇氣。']];
S.pray_revenge = [['あいつを許せない。この憎しみを、どうすればいいのですか。', '無法原諒那傢伙。這份恨意，我該怎麼辦。'], ['奪われたものを、取り返したい。', '我想奪回被搶走的東西。']];
S.pray_forgive = [['取り返しのつかないことをしました。赦しを、どうか。', '我犯下了無法挽回的錯。求您寬恕。'], ['あの日の言葉を、取り消せるなら……。', '若能收回那天說的話……。']];
S.pray_birth = [['もうすぐ、子が生まれます。母子ともに無事でありますように。', '孩子就快出生了。願母子平安。']];
S.pray_fear = [['死ぬのが、怖いのです。眠るたび、闇が近づいてくる。', '我害怕死亡。每次入睡，黑暗都更近一步。'], ['この命は、どこへ行くのでしょう。', '這條生命，究竟要往哪裡去呢。']];
S.pk = {}; // prayer kind names
['sick:病気:疾病', 'hunger:飢え:飢餓', 'love:恋:戀情', 'battle:戦の加護:戰場加護', 'revenge:復讐:復仇', 'forgive:赦し:寬恕', 'birth:子の誕生:新生命', 'fear:死の恐れ:死亡恐懼'].forEach(s => { const a = s.split(':'); S['pk_' + a[0]] = [a[1], a[2]]; });

const PLACES = { // key -> names

/* ---------- power casting UI flow ---------- */
function selectPower(i) {
  if (!G || G.ending || Game.scene !== 'play') return;
  const p = POWERS[i]; const cost = powerCost(p.id);
  if (G.faith < cost) { UI.toast(t('faith_short'), '#ff8a8a'); Snd.se('fail'); return; }
  if (p.id === 'force') { Screens.menu([[t('force_light'), () => doCast('force', 0, 'light')], [t('force_dark'), () => doCast('force', 0, 'dark')]], p.n[li()]); return; }
  Game.power = Game.power === p.id ? null : p.id; Snd.se('cursor'); UI.refresh(true);
}
function castOn(pid, tid) {
  if (pid === 'oracle') Screens.menu([['brave', 'careful', 'kind'].map(k => [t('dir_' + k), () => doCast('oracle', tid, k)])].flat(), POWER_BY_ID.oracle.n[li()]);
  else if (pid === 'soul') Screens.menu(['good', 'evil', 'deed', 'attach'].map(k => [t('dir_' + k), () => doCast('soul', tid, k)]), POWER_BY_ID.soul.n[li()]);
  else doCast(pid, tid);
}
function doCast(pid, tid, dir) {
  Game.power = null;
  const res = castPower(pid, tid, dir);
  UI.lastPray = ''; UI.lastFav = ''; Screens.closeMenu();
  if (!res.ok) { UI.toast(res.err === 'faith' ? t('faith_short') : '…', '#ff8a8a'); Snd.se('fail'); UI.refresh(true); return; }
  const idx = POWERS.findIndex(p => p.id === pid);
  Snd.se('power' + (idx + 1)); setTimeout(() => Snd.se(res.outcome === 'crit' ? 'crit' : res.outcome === 'success' ? 'success' : res.outcome === 'twist' ? 'twist' : 'fail'), 300);
  if (res.outcome !== 'fail') { Snd.playSong('divine'); Game.bgmName = 'divine'; Game.divineUntil = performance.now() + 9000; }
  const nmz = res.name ? res.name[li()] : '';
  const head = (nmz ? nmz + ' ← ' : '') + POWER_BY_ID[pid].n[li()] + '（' + t('succ') + ' ' + Math.round(res.p * 100) + '%）';
  UI.banner(t('out_' + res.outcome) + ' ' + t('out_sub_' + res.outcome), [head].concat(castReason(res)), res.outcome);
  if (Game.tut && Game.tut.on) Game.tut.afterCast(res);
  UI.refresh(true);
}

/* ---- cast result reason text (R5-7) ---- */
function castReason(res) {
  const nm = res.name ? res.name[li()] : '', pid = res.pid, o = res.outcome; const lines = [];
  if (pid === 'oracle') {
    if (o === 'crit' || o === 'success') lines.push(fmt(t('res_oracle_ok'), { name: nm, b: t('bias_' + res.biasKind) }));
    else if (o === 'twist') lines.push(fmt(t('res_oracle_twist'), { name: nm, b: t('bias_' + res.biasKind) }));
  } else if (pid === 'grace') {
    if (o === 'crit') lines.push(fmt(t('res_grace_crit'), { name: nm })); else if (o === 'success') lines.push(fmt(t('res_grace_ok'), { name: nm })); else if (o === 'twist') lines.push(fmt(t('res_grace_twist'), { name: nm }));
  } else if (pid === 'trial') {
    if (o === 'crit') lines.push(fmt(t('res_trial_crit'), { name: nm })); else if (o === 'success') lines.push(fmt(t('res_trial_ok'), { name: nm })); else if (o === 'twist') lines.push(t('res_trial_twist'));
  } else if (pid === 'soul') {
    if (o === 'crit' || o === 'success') lines.push(fmt(t('res_soul_ok'), { k: t('k_' + res.dir), n: '+' + (res.kamt || 0).toFixed(1) })); else if (o === 'twist') lines.push(t('res_soul_twist'));
  } else if (pid === 'force') {
    const d = Math.round(res.bal || 0);
    if (o === 'crit' || o === 'success') lines.push(res.dir === 'dark' ? fmt(t('res_force_dark'), { n: d }) : fmt(t('res_force_ok'), { d: t('a_light'), n: '+' + d })); else if (o === 'twist') lines.push(t('res_force_twist'));
  }
  if (res.gain) lines.push(fmt(t('res_head_resolved'), { name: nm, pk: res.pk ? t('pk_' + res.pk) : '', g: res.gain }));
  if (o === 'fail') {
    lines.push(t('res_fail_gen'));
    if (fatigueStage(pid) > 0) lines.push(t('res_why_fatigue')); else if (res.p < 0.5) lines.push(t('res_why_faith')); else lines.push(fmt(t('res_why_luck'), { p: Math.round(res.p * 100) }));
  }
  lines.push(fmt(t('res_cost'), { c: res.cost, f: Math.floor(G.faith) }));
  return lines;
}

  next() { this.i++; if (this.i >= this.steps.length) { this.stop(true); return; } Snd.se('ok'); this.show(); },

  },
  show() {
    const s = this.steps[this.i]; if (!s) return; if (s.enter) s.enter(); this.applyLocks(s.id);
    const d = $('tut'); d.innerHTML = '';
    this.hole = h('div', { class: 'hole' }); this.box = h('div', { class: 'box win glass', style: 'padding:8px 12px' });
    this.txt = h('div', { style: 'font-size:16px;line-height:1.55;color:#fff' });
    const btns = h('div', { style: 'margin-top:8px;display:flex;justify-content:space-between;align-items:center' }, h('span', { class: 'sm' }, fmt(t('tut_step'), { i: this.i + 1, n: this.steps.length })),
      h('span', null, s.next ? h('span', { class: 'btn on', style: 'margin-right:6px', onclick: () => this.next() }, s.last ? t('close') : t('next')) : null, h('span', { class: 'btn', onclick: () => this.stop(true) }, t('skip'))));

  },
  layout(force) {
    const s = this.steps[this.i]; if (!s) return; const r = !s.noHole && !Game.modals.length ? s.target && s.target() : null;
    this.txt.textContent = s.text();
    if (r) { this.hole.style.display = 'block'; this.hole.style.left = (r.x - 6) + 'px'; this.hole.style.top = (r.y - 6) + 'px'; this.hole.style.width = (r.w + 12) + 'px'; this.hole.style.height = (r.h + 12) + 'px'; }
    else this.hole.style.display = 'none';
    const bw = 420, bh = Math.max(120, Math.ceil((this.box.offsetHeight || 150) / (Scale.s || 1))); let bx, by;
    if (Game.modals.length || !r) { bx = Game.modals.length ? 800 : 430; by = Game.modals.length ? 576 : 280; }
    else {
      const ov = (x, y) => !(x + bw < r.x - 8 || x > r.x + r.w + 8 || y + bh < r.y - 8 || y > r.y + r.h + 8);

      const cands = [[r.x + r.w + 24, cy - bh / 2], [r.x - bw - 24, cy - bh / 2], [cx - bw / 2, r.y + r.h + 24], [cx - bw / 2, r.y - bh - 24], [830, 70], [20, 580], [430, 580], [430, 60]];
      let pick = null; for (const c of cands) { const x = clamp(c[0], 4, 1276 - bw), y = clamp(c[1], 4, 716 - bh); if (fits(x, y)) { pick = [x, y]; break; } }

  update() {
    if (!this.on) return; const s = this.steps[this.i]; if (!s) return;
    if (s.id === 'pick' && Game.power && Game.power !== 'eye' && Game.power !== (G.prayers.find(q => q.id === this.pid) ? PRAYER_ANS[G.prayers.find(q => q.id === this.pid).kind][0] : 'grace')) { Game.power = null; this.wrong = true; UI.refresh(true); }

  },
  afterCast(res) {
    // make the first chapter about this very act so the chronicle step has something to read
    const ev = G.events.slice().reverse().find(e => !e.used && (e.type === 'divine_act' || e.type === 'miracle') && e.t >= G.tick - 2);

    G.tut.prayer = true; UI.lastPray = '';
  },
};
Game.tut = null;
