<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],JA=new URLSearchParams(location.search).get('lang')==='ja';let lang=JA?'ja':'zh';

try{visibility={...visibility,...JSON.parse(localStorage.getItem('ui_v5_preview_visibility')||'{}')}}catch(e){}

function translate(){document.documentElement.lang=lang==='ja'?'ja':'zh-Hant';$$('[data-ja]').forEach(e=>{if(!e.dataset.zh)e.dataset.zh=e.textContent;e.textContent=e.dataset[lang]});$('#powers').innerHTML=names.map((n,i)=>`<button class="power" aria-pressed="${selectedPower===i}" data-power="${i}" aria-label="${n[lang==='ja'?1:0]} ${tr('消耗信仰','信仰消費')} ${[6,11,25,30,40][i]}"><kbd>${i+1}</kbd><img class="icon" src="${base}icon_power_${ids[i]}_32.png" alt=""><span class="name">${n[lang==='ja'?1:0]}</span><span class="cost muted">${tr('信仰','信仰')} ${[6,11,25,30,40][i]}</span></button>`).join('');$$('[data-power]').forEach(b=>b.onclick=()=>selectPower(+b.dataset.power));renderList();sync();}
function selectPower(i){selectedPower=selectedPower===i?-1:i;translate();$('#help').hidden=selectedPower<0;if(selectedPower>=0)$('#help').innerHTML=`<h2>${names[i][lang==='ja'?1:0]}</h2><p>${tr('選擇地圖上的目標以確認效果。本頁不執行施放。','地図の対象を選んで効果を確認します。この試作では発動しません。')}</p><p class="small">Esc · ${tr('取消選擇','選択を解除')}</p>`;}
function renderList(){const sets=[[[tr('急件 · 需要治療','急ぎ · 治療の願い'),tr('莉娜希望家人平安。','リナは家族の無事を願っています。'),tr('剩餘 1 日 · 定位居民 →','残り1日 · 住人を見る →')],[tr('祈求豐收','豊作の願い'),tr('農夫期盼今年有好收成。','農夫は今年の豊作を祈っています。'),tr('剩餘 3 日 · 定位居民 →','残り3日 · 住人を見る →')]],[[tr('新的居民抵達','新しい住人が到着'),tr('村莊迎來新的生活。','村に新たな暮らしが始まります。'),tr('今日 · 閱讀詳情 →','今日 · 詳細を見る →')]],[[tr('尚未選擇眷顧者','寵愛者はまだいません'),tr('從居民資料中選擇眷顧對象。','住人の詳細から寵愛する相手を選べます。'),tr('開啟居民資料 →','住人の詳細へ →')]],[[tr('本期神旨','今期の神旨'),tr('查看評定會決定的目標。','評定会で決めた目標を確認します。'),tr('查看神旨 →','神旨を確認 →')]]];$('#list').innerHTML=sets[tabIndex].map((v,i)=>`<button class="card ${tabIndex===0&&i===0?'urgent':''}"><h3>${v[0]}</h3><p>${v[1]}</p><span class="small">${v[2]}</span></button>`).join('');$$('.card').forEach(b=>b.onclick=()=>{if(tabIndex===3)showModal('council');else showInfo(b.querySelector('h3').textContent,tr('此處接入既有居民定位／資料視窗；不直接消耗信仰。','既存の住人詳細・位置確認へ接続します。信仰は消費しません。'))});}
function sync(){for(const k of ['top','map','bottom'])$$(`[data-zone=${k}]`).forEach(e=>e.hidden=viewing||!visibility[k]);$('#compact').style.display=viewing?'flex':'none';$('#restore').style.display=viewing||!visibility.top?'block':'none';$('#restore').textContent=viewing?tr('返回操作 U','操作に戻る U'):tr('介面顯示','表示設定');$$('.zone').forEach(e=>{e.setAttribute('aria-pressed',visibility[e.dataset.key]);e.textContent=(visibility[e.dataset.key]?'✓ ':'— ')+({top:tr('上方資訊','上部情報'),map:tr('地圖資訊','地図情報'),bottom:tr('下方操作','下部操作')}[e.dataset.key])});localStorage.setItem('ui_v5_preview_visibility',JSON.stringify(visibility));}
function display(open){$('#display').hidden=!open;$('#displayButton').setAttribute('aria-expanded',open);if(open)$('#display .zone').focus()}
function view(){if(viewing){visibility={...saved};viewing=false}else{saved={...visibility};viewing=true}display(false);$('#help').hidden=true;sync();(viewing?$('#restore'):visibility.top?$('#displayButton'):$('#restore')).focus()}
$('#displayButton').onclick=()=>display($('#display').hidden);$('#restore').onclick=()=>viewing?view():display($('#display').hidden);$('#view').onclick=view;$('#all').onclick=()=>{visibility={top:true,map:true,bottom:true};viewing=false;sync();display(false);$('#displayButton').focus()};$$('.zone').forEach(e=>e.onclick=()=>{visibility[e.dataset.key]=!visibility[e.dataset.key];sync()});
$$('.tab').forEach((b,i)=>{b.onclick=()=>{tabIndex=i;$$('.tab').forEach((t,j)=>t.setAttribute('aria-selected',i===j));renderList()};b.onkeydown=e=>{if(['ArrowRight','ArrowLeft'].includes(e.key)){e.preventDefault();const next=(i+(e.key==='ArrowRight'?1:3))%4;$$('.tab')[next].click();$$('.tab')[next].focus()}}});
$('#language').onclick=()=>{lang=lang==='ja'?'zh':'ja';translate()};let speed=1;$('#speed').onclick=()=>{$('#speed').textContent='×'+[1,4,16,64][speed=(speed+1)%4];$('#compactSpeed').textContent=$('#speed').textContent};$('#pause').onclick=()=>{const p=$('#pause').getAttribute('aria-pressed')!=='true';$('#pause').setAttribute('aria-pressed',p);$('#pause img').src=base+'icon_'+(p?'speed':'pause')+'_32.png'};
function closeModal(){$('#overlay').hidden=true;previousFocus?.focus()}
function shell(title,body,foot){previousFocus=document.activeElement;$('#overlay').innerHTML=`<section class="modal asset" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><header><div><div class="small gold">輪迴之天秤 · ${tr('神域紀錄','神域の記録')}</div><h1 id="modalTitle">${title}</h1></div><button class="button close" aria-label="${tr('關閉','閉じる')}"><img class="icon" src="${base}icon_close_32.png" alt=""></button></header><div class="body">${body}</div><footer>${foot}</footer></section>`;$('#overlay').hidden=false;$('.close').onclick=closeModal;$('.close').focus()}
function showInfo(title,text){shell(title,`<p>${text}</p>`,`<span class="small">${tr('設計預覽 · 不改變遊戲資料','デザイン試作 · ゲームのデータは変更しません')}</span><button class="button done">${tr('返回','戻る')}</button>`);$('.done').onclick=closeModal}
function showModal(kind){if(kind==='council'){shell(tr('眾神評定會','神々の評定会'),`<div class="row between"><h2>${tr('為下一期選擇兩個神旨','次の期間の神旨を2つ選ぶ')}</h2><span class="gold" id="count"></span></div><div class="choices">${[tr('人類側','人の側'),tr('魔族側','魔の側'),tr('采配','采配')].map((n,i)=>`<button class="choice asset" data-choice="${i}" aria-pressed="${picked.has(i)}"><div class="seal"><img src="${base}icon_power_${ids[i]}_64.png" alt=""><h2>${n}</h2></div><p>${[tr('下一場攻防零死亡','次の攻防で死者を出さない'),tr('畏怖達到 100 以上','畏怖を100以上にする'),tr('天秤維持在 ±25 內（期間 8 成）','天秤を±25の内に保つ（期間の8割）')][i]}</p><span class="small">${tr('選擇／取消','選択／解除')}</span></button>`).join('')}</div><div class="row between"><div><h3>${tr('神敕 · 可選，最多一個','神勅 · 任意、1つまで')}</h3><p class="small">${tr('可以追加一個神敕，也可以保留信仰。','神勅を1つ追加することも、信仰を残すこともできます。')}</p></div><button class="button" id="edict">${tr('不使用神敕','神勅なし')}</button></div>`,`<span class="small">${tr('決定前不扣除信仰','決定するまで信仰は消費しません')}</span><button class="button" id="confirm">${tr('確定兩個神旨','2つの神旨を決定')}</button>`);function update(){$('#count').textContent=picked.size+' / 2';$('#confirm').disabled=picked.size!==2;$$('[data-choice]').forEach(b=>b.setAttribute('aria-pressed',picked.has(+b.dataset.choice)))}$$('[data-choice]').forEach(b=>b.onclick=()=>{const i=+b.dataset.choice;if(picked.has(i))picked.delete(i);else if(picked.size<2)picked.add(i);update()});$('#confirm').onclick=closeModal;$('#edict').onclick=()=>showInfo(tr('神敕選擇','神勅の選択'),tr('接入既有 EDICTS 清單，顯示每項效果、費用與信仰不足原因。此預覽未執行神敕。','既存の EDICTS 一覧へ接続し、効果・費用・信仰不足の理由を表示します。'));update();}
else if(kind==='report') {shell(tr('防衛戰報','防衛戦の報告'),`<div class="outcome"><h2>${tr('守住了村莊','村を守り抜いた')}</h2><p class="muted">${tr('戰鬥已結束，請確認損失與重建需求。','戦闘が終了しました。被害と再建の必要を確認してください。')}</p></div><div class="stats"><div class="stat">${tr('傷亡居民','住人の犠牲')}<strong>2</strong><span class="small">${tr('查看名單','名簿を確認')}</span></div><div class="stat">${tr('損毀建築','損壊した建物')}<strong>1</strong><span class="small">${tr('需要重建','再建が必要')}</span></div><div class="stat">${tr('神力介入','神の介入')}<strong>3</strong><span class="small">${tr('查看紀錄','記録を確認')}</span></div></div><h3>${tr('接下來可以做什麼','次にできること')}</h3><p>${tr('確認傷者與損毀建築，再決定是否使用神力協助復原。','負傷者と損壊した建物を確認して、神の力で復旧を支えるか判断します。')}</p><p class="small">${tr('完整戰鬥經過可於史官紀錄中查看。','戦いの経過は史官の記録で確認できます。')}</p>`,`<span class="small">${tr('關閉戰報後回到原本的介面顯示設定','閉じると元の表示設定に戻ります')}</span><button class="button done">${tr('返回村莊','村へ戻る')}</button>`);$('.done').onclick=closeModal}}
$('#map').onclick=()=>showInfo(tr('世界地圖','世界地図'),tr('這裡繪製現有地圖資料，點擊可移動鏡頭；不可把背景截圖當作可互動地圖。','既存の地図データを描画し、クリックでカメラを移動します。背景画像を地図データとして使用しないでください。'));
$('#prep').onclick=()=>showInfo(tr('備戰','防衛の備え'),tr('沿用現有防衛視窗，顯示預測依據、準備項目與費用。勝率為估計，不是保證。','既存の防衛画面へ接続し、予測の根拠・準備内容・費用を表示。勝率は推定です。'));
$('#menu').onclick=()=>{shell(tr('選單','メニュー'),`<div class="menuitems"><h2>${tr('村莊與紀錄','村と記録')}</h2>${[tr('居民','住人'),tr('靈魂','魂'),tr('史官','史官'),tr('神眼','神眼'),tr('顧問','助言者'),tr('操作說明','操作説明')].map(n=>`<button class="button">${n}</button>`).join('')}<h2>${tr('遊戲','ゲーム')}</h2>${[tr('儲存／讀取','保存／読込'),tr('設定','設定'),tr('返回標題','タイトルへ')].map(n=>`<button class="button">${n}</button>`).join('')}</div>`,`<span class="small">${tr('常用操作留在畫面，其他功能集中於此。','よく使う操作は画面に、その他の機能はここに。')}</span><button class="button done">${tr('返回遊戲','ゲームへ戻る')}</button>`);$('.done').onclick=closeModal;$$('.menuitems button').forEach(b=>b.onclick=()=>showInfo(b.textContent,tr('接入現有功能；預覽不執行遊戲操作。','既存の機能へ接続します。この試作ではゲーム操作を実行しません。')))};
let timer;function notice(){$('#toast').textContent=tr('！新的祈禱已抵達，可在村莊消息中查看。','！新しい祈りが届きました。村の便りで確認できます。');$('#toast').hidden=false;clearTimeout(timer);timer=setTimeout(()=>$('#toast').hidden=true,3000)}
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(!$('#overlay').hidden)closeModal();else if(!$('#display').hidden){display(false);(viewing||!visibility.top?$('#restore'):$('#displayButton')).focus()}else{$('#help').hidden=true;selectedPower=-1;translate()}return}if(!$('#overlay').hidden){if(e.key==='Tab'){const f=[...$('#overlay').querySelectorAll('button:not(:disabled)')];if(e.shiftKey&&document.activeElement===f[0]){e.preventDefault();f.at(-1).focus()}else if(!e.shiftKey&&document.activeElement===f.at(-1)){e.preventDefault();f[0].focus()}}return}if(e.key.toLowerCase()==='u'){e.preventDefault();view()}if(/^[1-5]$/.test(e.key)&&!viewing&&visibility.bottom)selectPower(+e.key-1)});translate();
</script></html>
