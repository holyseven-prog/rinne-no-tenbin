<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="580" style="font-family:'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei',sans-serif"><rect width="100%" height="100%" fill="#0a0a14"/><defs><marker id="a" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#e8d9a0"/></marker></defs><text x="600" y="48" text-anchor="middle" font-size="30" font-weight="700" fill="#f6efd9">研發路線：4 個階段・3 道關卡</text><text x="600" y="78" text-anchor="middle" font-size="16" fill="#aab">最大風險「模擬日誌能不能寫成好看的小說」放在最前面驗證</text><rect x="40" y="120" width="1120" height="60" rx="6" fill="#3a3a4a" stroke="#888" stroke-width="3"/><text x="600.0" y="144.0" text-anchor="middle" font-size="22" font-weight="700" fill="#fff">前置工作</text><text x="600.0" y="170.0" text-anchor="middle" font-size="13" fill="#d8dcf0">企劃案完善 → 視覺設計定調（垂直切片）→ 程序原型開工</text><rect x="40" y="250" width="200" height="170" rx="8" fill="#5a3a1d" stroke="#ffb86f" stroke-width="3"/><text x="140.0" y="286" text-anchor="middle" font-size="16" fill="#ffb86f">階段 0</text><text x="140.0" y="320" text-anchor="middle" font-size="24" font-weight="700" fill="#fff">敘事驗證</text><text x="140.0" y="358" text-anchor="middle" font-size="15" fill="#d8dcf0">腳本＋手動挑場景</text><text x="140.0" y="382" text-anchor="middle" font-size="15" fill="#d8dcf0">（不依賴引擎，兩語並行）</text><line x1="240" y1="335" x2="264" y2="335" stroke="#e8d9a0" stroke-width="3"  marker-end="url(#a)"/><polygon points="288,302 312,335 288,370 264,335" fill="#8a1d2e" stroke="#ff8f9f" stroke-width="3"/><line x1="312" y1="335" x2="336" y2="335" stroke="#e8d9a0" stroke-width="3"  marker-end="url(#a)"/><text x="288" y="440" text-anchor="middle" font-size="14" fill="#ff8f9f">關卡 1</text><text x="288" y="460" text-anchor="middle" font-size="14" fill="#d8dcf0">日誌能否寫成</text><text x="288" y="480" text-anchor="middle" font-size="14" fill="#d8dcf0">讓人想讀的小說</text><rect x="336" y="250" width="200" height="170" rx="8" fill="#1d3a5f" stroke="#6fc3ff" stroke-width="3"/><text x="436.0" y="286" text-anchor="middle" font-size="16" fill="#6fc3ff">階段 1</text><text x="436.0" y="320" text-anchor="middle" font-size="24" font-weight="700" fill="#fff">HTML 原型</text><text x="436.0" y="358" text-anchor="middle" font-size="15" fill="#d8dcf0">Codex 單檔 index.html</text><text x="436.0" y="382" text-anchor="middle" font-size="15" fill="#d8dcf0">驗證玩法與史官</text><line x1="536" y1="335" x2="560" y2="335" stroke="#e8d9a0" stroke-width="3"  marker-end="url(#a)"/><polygon points="584,302 608,335 584,370 560,335" fill="#8a1d2e" stroke="#ff8f9f" stroke-width="3"/><line x1="608" y1="335" x2="632" y2="335" stroke="#e8d9a0" stroke-width="3"  marker-end="url(#a)"/><text x="584" y="440" text-anchor="middle" font-size="14" fill="#ff8f9f">關卡 2</text><text x="584" y="460" text-anchor="middle" font-size="14" fill="#d8dcf0">玩法是否好玩</text><text x="584" y="480" text-anchor="middle" font-size="14" fill="#d8dcf0">（試玩）</text><rect x="632" y="250" width="200" height="170" rx="8" fill="#2a2f5a" stroke="#8fa0ff" stroke-width="3"/><text x="732.0" y="286" text-anchor="middle" font-size="16" fill="#8fa0ff">階段 2</text><text x="732.0" y="320" text-anchor="middle" font-size="24" font-weight="700" fill="#fff">MVP 第一版</text><text x="732.0" y="358" text-anchor="middle" font-size="15" fill="#d8dcf0">一城鎮・一公會・一地下城</text><text x="732.0" y="382" text-anchor="middle" font-size="15" fill="#d8dcf0">一個完整魔王循環</text><line x1="832" y1="335" x2="856" y2="335" stroke="#e8d9a0" stroke-width="3"  marker-end="url(#a)"/><polygon points="880,302 904,335 880,370 856,335" fill="#8a1d2e" stroke="#ff8f9f" stroke-width="3"/><line x1="904" y1="335" x2="928" y2="335" stroke="#e8d9a0" stroke-width="3"  marker-end="url(#a)"/><text x="880" y="440" text-anchor="middle" font-size="14" fill="#ff8f9f">關卡 3</text><text x="880" y="460" text-anchor="middle" font-size="14" fill="#d8dcf0">是否值得擴充</text><text x="880" y="480" text-anchor="middle" font-size="14" fill="#d8dcf0">（完成率・書籤數）</text><rect x="928" y="250" width="200" height="170" rx="8" fill="#2f5a2a" stroke="#8fe08f" stroke-width="3"/><text x="1028.0" y="286" text-anchor="middle" font-size="16" fill="#8fe08f">階段 3</text><text x="1028.0" y="320" text-anchor="middle" font-size="24" font-weight="700" fill="#fff">擴充</text><text x="1028.0" y="358" text-anchor="middle" font-size="15" fill="#d8dcf0">神使・教會・眾神議會</text><text x="1028.0" y="382" text-anchor="middle" font-size="15" fill="#d8dcf0">作品展示站・多結局</text><line x1="600" y1="180" x2="150" y2="250" stroke="#888" stroke-width="3" stroke-dasharray="6 5" marker-end="url(#a)"/><text x="600" y="545" text-anchor="middle" font-size="15" fill="#aab">各階段結束前設「是否繼續」關卡；成功指標的數值門檻由團隊討論後訂定</text></svg>