<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="580" style="font-family:'Noto Sans CJK TC','Noto Sans TC','Microsoft JhengHei',sans-serif"><rect width="100%" height="100%" fill="#0a0a14"/><defs><marker id="a" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#e8d9a0"/></marker></defs><text x="600" y="48" text-anchor="middle" font-size="30" font-weight="700" fill="#f6efd9">系統架構：事實與文字分離</text><text x="600" y="78" text-anchor="middle" font-size="16" fill="#aab">模擬引擎鎖定所有事實，語言模型只負責「怎麼講」</text><rect x="40" y="110" width="250" height="70" rx="6" fill="#2a2f5a" stroke="#8fa0ff" stroke-width="3"/><text x="165.0" y="139.0" text-anchor="middle" font-size="22" font-weight="700" fill="#fff">輸入① 玩家介入</text><text x="165.0" y="165.0" text-anchor="middle" font-size="13" fill="#d8dcf0">神力・書籤・伏筆之筆・沉默之筆</text><rect x="40" y="400" width="250" height="70" rx="6" fill="#2a2f5a" stroke="#8fa0ff" stroke-width="3"/><text x="165.0" y="429.0" text-anchor="middle" font-size="22" font-weight="700" fill="#fff">輸入② 世界與神格設定</text><text x="165.0" y="455.0" text-anchor="middle" font-size="13" fill="#d8dcf0">神格・執念・基調・世界觀</text><rect x="330" y="235" width="190" height="100" rx="6" fill="#1d3a5f" stroke="#6fc3ff" stroke-width="3"/><text x="425.0" y="279.0" text-anchor="middle" font-size="22" font-weight="700" fill="#fff">① 模擬引擎</text><text x="425.0" y="305.0" text-anchor="middle" font-size="13" fill="#d8dcf0">居民AI・鎖定事實</text><rect x="555" y="235" width="170" height="100" rx="6" fill="#1d3a5f" stroke="#6fc3ff" stroke-width="3"/><text x="640.0" y="279.0" text-anchor="middle" font-size="22" font-weight="700" fill="#fff">② 事件日誌</text><text x="640.0" y="305.0" text-anchor="middle" font-size="13" fill="#d8dcf0">動機・關係・戲劇類型</text><rect x="750" y="235" width="190" height="100" rx="6" fill="#5a3a1d" stroke="#ffb86f" stroke-width="3"/><text x="845.0" y="279.0" text-anchor="middle" font-size="22" font-weight="700" fill="#fff">③ 敘事導演</text><text x="845.0" y="305.0" text-anchor="middle" font-size="13" fill="#d8dcf0">故事線・場景・伏筆・主題</text><rect x="970" y="235" width="190" height="100" rx="6" fill="#5a3a1d" stroke="#ffb86f" stroke-width="3"/><text x="1065.0" y="279.0" text-anchor="middle" font-size="22" font-weight="700" fill="#fff">④ 文字生成</text><text x="1065.0" y="305.0" text-anchor="middle" font-size="13" fill="#d8dcf0">逐場景寫作＋一致性檢查</text><rect x="965" y="430" width="190" height="70" rx="6" fill="#2f5a2a" stroke="#8fe08f" stroke-width="3"/><text x="1060.0" y="459.0" text-anchor="middle" font-size="22" font-weight="700" fill="#fff">⑤ 出版輸出</text><text x="1060.0" y="485.0" text-anchor="middle" font-size="13" fill="#d8dcf0">網頁閱讀・EPUB・設定集</text><rect x="750" y="430" width="190" height="70" rx="6" fill="#4a2a5a" stroke="#d79fff" stroke-width="3"/><text x="845.0" y="459.0" text-anchor="middle" font-size="22" font-weight="700" fill="#fff">故事聖經</text><text x="845.0" y="485.0" text-anchor="middle" font-size="13" fill="#d8dcf0">人物・關係・世界・伏筆表</text><line x1="290" y1="145" x2="330" y2="270" stroke="#e8d9a0" stroke-width="3"  marker-end="url(#a)"/><line x1="290" y1="435" x2="330" y2="300" stroke="#e8d9a0" stroke-width="3"  marker-end="url(#a)"/><line x1="520" y1="285" x2="555" y2="285" stroke="#e8d9a0" stroke-width="3"  marker-end="url(#a)"/><line x1="725" y1="285" x2="760" y2="285" stroke="#e8d9a0" stroke-width="3"  marker-end="url(#a)"/><line x1="930" y1="285" x2="965" y2="285" stroke="#e8d9a0" stroke-width="3"  marker-end="url(#a)"/><line x1="1060" y1="335" x2="1060" y2="430" stroke="#e8d9a0" stroke-width="3"  marker-end="url(#a)"/><line x1="845" y1="430" x2="845" y2="335" stroke="#d79fff" stroke-width="3" stroke-dasharray="6 5" marker-end="url(#a)"/><line x1="930" y1="465" x2="1010" y2="335" stroke="#d79fff" stroke-width="3" stroke-dasharray="6 5" marker-end="url(#a)"/><text x="600" y="545" text-anchor="middle" font-size="15" fill="#aab">虛線＝導演與文字生成共用同一份故事聖經；玩家介入先進入模擬引擎，事實從頭到尾只由模擬引擎決定</text></svg>